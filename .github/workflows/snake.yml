name: Generar snake de contribuciones

# Genera un SVG animado (una serpiente que "come" el grafico de contribuciones
# de GitHub) coloreado con la paleta del portafolio, y lo publica en la rama
# huerfana "output". El Hero del sitio lo consume directamente desde
# raw.githubusercontent.com, asi que no hace falta redeploy del sitio cuando
# se regenera: solo se refresca la imagen.

on:
  schedule:
    - cron: "0 */6 * * *" # cada 6 horas, para reflejar contribuciones recientes
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_dots=#0d101b,#2a2350,#4f3aa8,#7c5cff,#45d6f5&color_snake=#f2f4fa&color_dots_border=#05060b
            dist/github-snake-dark.svg?color_dots=#0d101b,#2a2350,#4f3aa8,#7c5cff,#45d6f5&color_snake=#f2f4fa&color_dots_border=#05060b

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
